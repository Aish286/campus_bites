<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Shop - Campus Bites</title>
  <style>
    :root {
      --primary-bg: #f9f6f1;
      --form-bg: #fff;
      --accent: #ff9a9e;
      --accent-hover: #fbc2eb;
      --accent-dark: #f67280;
      --text-dark: #2c3e50;
      --text-light: #555;
      --shadow: rgba(0, 0, 0, 0.1);
      --transition-fast: 0.3s ease;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background: url("{{ url_for('static', filename='kj.png') }}") center center fixed;
      background-size: cover;
      background-repeat: no-repeat;
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
    }

    .wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    * {
      box-sizing: border-box;
    }

    .navbar {
      background: linear-gradient(90deg, #1c2331, #2c3e50);
      color: white;
      padding: 1.2rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 12px var(--shadow);
    }

    .navbar .logo h1 {
      margin: 0;
      font-size: 1.8rem;
      font-weight: bold;
    }

    .nav-actions {
      display: flex;
      gap: 1.5rem;
    }

    .nav-actions a {
      color: white;
      text-decoration: none;
      font-weight: 500;
      transition: color var(--transition-fast);
      position: relative;
    }

    .nav-actions a::after {
      content: '';
      position: absolute;
      width: 0%;
      height: 2px;
      bottom: -4px;
      left: 0;
      background-color: var(--accent-hover);
      transition: width var(--transition-fast);
    }

    .nav-actions a:hover {
      color: var(--accent-hover);
    }

    .nav-actions a:hover::after {
      width: 100%;
    }

    .container {
      max-width: 2200px;
      background: rgba(255, 255, 255, 0.92);
      margin: 3rem auto;
      padding: 4rem;
      border-radius: 16px;
      box-shadow: 0 8px 24px var(--shadow);
      border: 2px solid;
      border-image: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb) 1;
      backdrop-filter: blur(8px);
      transition: all var(--transition-fast);
    }

    h1 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 2rem;
    }

    form {
      display: grid;
      gap: 1.5rem;
    }

    label {
      font-weight: 500;
      margin-bottom: 0.3rem;
      display: block;
      color: var(--text-light);
      transition: color var(--transition-fast);
    }

    input[type="text"],
    input[type="number"],
    input[type="file"],
    input[type="time"],
    select,
    textarea {
      width: 100%;
      padding: 16px;
      font-size: 1.1rem;
      border-radius: 12px;
      border: 1px solid #ccc;
      background: var(--primary-bg);
      transition: border var(--transition-fast), background var(--transition-fast), transform var(--transition-fast);
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--accent);
      background: #fff;
      outline: none;
      transform: scale(1.02);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .checkbox-group,
    .time-group {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
    }

    .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .time-group > div {
      flex: 1;
      min-width: 45%;
    }

    select[multiple] {
      height: auto;
      min-height: 80px;
    }

    #capacity_field {
      display: none;
    }

    .btn {
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      color: var(--text-dark);
      padding: 16px 28px;
      font-weight: bold;
      font-size: 1.2rem;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: background var(--transition-fast), transform var(--transition-fast);
      text-align: center;
    }

    .btn:hover {
      background: linear-gradient(135deg, var(--accent-hover), #a6c1ee);
      transform: scale(1.05);
    }

    .btn:active {
      transform: scale(0.97);
    }

    footer {
      background: #1c2331;
      color: #fff;
      padding: 1.2rem;
      text-align: center;
      border-radius: 16px 16px 0 0;
      margin-top: auto;
      box-shadow: 0 -4px 12px var(--shadow);
    }

    @media (min-width: 768px) {
      form > label[for="shop_logo"],
      form > label[for="name"],
      form > label[for="description"],
      form > label[for="address"],
      form > label[for="category"],
      form > label[for="dining_availability"],
      form > label[for="shop_capacity"],
      form > label[for="processing_power"],
      form > label[for="contact_number"],
      form > label[for="closed_days"],
      form > label[for="discount"] {
        margin-top: 0.5rem;
      }

      #description,
      #address {
        display: inline-block;
        width: 48%;
      }
    }
  </style>

  <script>
    function toggleCapacity() {
      let dining = document.getElementById("dining_availability").value;
      let capacityField = document.getElementById("capacity_field");
      capacityField.style.display = (dining === "true") ? "block" : "none";
    }

    function validateForm(event) {
      let dining = document.getElementById("dining_availability").value;
      let capacity = document.getElementById("shop_capacity").value;
      if (dining === "true" && (capacity === "" || parseInt(capacity) <= 0)) {
        alert("Please enter a valid Shop Capacity if Dining is available.");
        event.preventDefault();
      }
    }

    window.onload = function () {
      toggleCapacity();
      document.querySelector("form").addEventListener("submit", validateForm);
    };
  </script>
</head>
<body>
  <header class="navbar">
    <div class="logo">
      <h1>Campus Bites</h1>
    </div>
    <div class="nav-actions">
      <a href="/owner_dashboard">Dashboard</a>
      <a href="/owner_orders">Order Queue</a>
      <a href="/manage_shop">Your Shop</a>
      <a href="{{ url_for('view_orders') }}">View Orders</a>
      <a href="/owner_profile">Profile</a>
      <a href="/logout">Logout</a>
    </div>
  </header>

  <div class="container">
    <h1>Create a New Shop</h1>
    <form method="POST" enctype="multipart/form-data">
<!--       <label for="shop_logo">Shop Logo:</label>
      <input type="file" id="shop_logo" name="shop_logo" accept="image/*"> -->

      <label for="name">Shop Name:</label>
      <input type="text" id="name" name="name" required>

      <label for="description">Description:</label>
      <textarea id="description" name="description"></textarea>

      <label for="address">Shop Address:</label>
      <input type="text" id="address" name="address" required>

      <label for="category">Category:</label>
      <select id="category" name="category" required>
        <option value="Veg">Veg</option>
        <option value="Non-Veg">Non-Veg</option>
        <option value="Both">Both</option>
      </select>

      <label for="dining_availability">Dining Available?</label>
      <select id="dining_availability" name="dining_availability" onchange="toggleCapacity()">
        <option value="true">Yes</option>
        <option value="false">No</option>
      </select>

      <div id="capacity_field" style="display: none;">
        <label for="shop_capacity">Shop Capacity (Seats):</label>
        <input type="number" id="shop_capacity" name="shop_capacity" min="1">
      </div>

      <label for="processing_power">Processing Power (W):</label>
      <input type="number" id="processing_power" name="processing_power" min="0">

      <label>Shop Timings:</label>
      <div class="time-group">
        <div>
          <label for="shop_open">Opens At:</label>
          <input type="time" id="shop_open" name="shop_open" required>
        </div>
        <div>
          <label for="shop_close">Closes At:</label>
          <input type="time" id="shop_close" name="shop_close" required>
        </div>
      </div>

      <label for="contact_number">Contact Number:</label>
      <input type="text" id="contact_number" name="contact_number" required>

      <label>Payment Methods Accepted:</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="payment_methods[]" value="Cash"> Cash</label>
        <label><input type="checkbox" name="payment_methods[]" value="UPI"> UPI</label>
      </div>

      <label for="closed_days">Closed Days:</label>
      <select id="closed_days" name="closed_days[]" multiple>
        <option value="Sunday">Sunday</option>
        <option value="Monday">Monday</option>
        <option value="Public Holidays">Public Holidays</option>
      </select>

      <label for="discount">Discount (%):</label>
      <input type="number" id="discount" name="discount" min="0" max="100" step="0.1" value="0.0">

      <button type="submit" class="btn">Create Shop</button>
    </form>
  </div>

  <footer>
    <p>&copy; 2025 Campus Bites. Made with ❤️ to bring students and campus dining together.</p>
  </footer>
</body>
</html>
